# dsh-deputy — DSH bundle patch layer
#
# 一个包、两个 Cordis 组件（插件管理器里显示成两行，和 billion-context 的做法一致）：
#   dsh-deputy/os      → src/os.mjs      桌面会话（默认操作真实桌面）+ 面板端点 + deputy_* 四个工具
#   dsh-deputy/browser → src/browser.mjs 浏览器操作骨架（CDP daemon）+ browser_* 五个工具
# insert 的 name 走 package.json 的 exports 子路径；插件入口就是各自的 apply(ctx)。
# dsh.client 指向浏览器半 client.js（侧栏「DSH操作电脑」一页 + 图标旁的状态点）。
# 本插件不依赖任何外部 npm 包（diff/sheet/png/roi/budget/runner/desktop/browser 均为纯 ESM），
# 因此不需要构建授权，也不需要 allowBuilds。

- insert:
    # 包根锚点：没有 id，所以不出现在插件管理器的组件列表里。
    # 作用只有一个：让 client-modules 的 exactPackageSpecifier('dsh-deputy') 命中包根，
    # 从而把 client.js 塞进 __DSH_BOOT__ 模块图（侧栏「DSH操作电脑」入口靠它）。
    - name: 'dsh-deputy'
    - id: dsh-deputy-os
      name: 'dsh-deputy/os'
      config:
        shipAt: meaningful
        settleMs: 220
        desktop:
          # user = 操作本机真实桌面（整屏截图 + SendInput）；isolated = 独立桌面。
          mode: user
          captureWidth: 1280
          captureHeight: 800
    - id: dsh-deputy-browser
      name: 'dsh-deputy/browser'
      config:
        enabled: true
        headless: false
