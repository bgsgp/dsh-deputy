# dsh-deputy — DSH bundle patch layer
#
# 把 dsh-deputy 以原生插件形态挂进 profile：id 全局唯一，name 为包名。
# 插件入口（src/index.mjs → apply(ctx)）由 dsh.plugin.json 的 entry.main 声明。
# 本插件不依赖任何外部 npm 包（diff/sheet/png/roi/budget/runner/desktop 均为纯 ESM），
# 因此不需要构建授权，也不需要 allowBuilds。

- insert:
    - id: dsh-deputy
      name: 'dsh-deputy'
      config:
        shipAt: meaningful
        settleMs: 220
        desktop:
          captureWidth: 1280
          captureHeight: 800
