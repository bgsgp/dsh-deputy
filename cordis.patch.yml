# dsh-deputy — DSH bundle patch layer
#
# 把 dsh-deputy 以原生插件形态挂进 profile：id 全局唯一，name 为包名。
# 插件入口由 package.json 的 main（src/index.mjs → apply(ctx)）声明；
# 本文件只负责 profile 里的 insert 条目，dsh.client 指向浏览器半 client.js。
# 本插件不依赖任何外部 npm 包（diff/sheet/png/roi/budget/runner/desktop 均为纯 ESM），
# 因此不需要构建授权，也不需要 allowBuilds。

- insert:
    - id: dsh-deputy
      name: 'dsh-deputy'
      config:
        shipAt: meaningful
        settleMs: 220
        desktop:
          captureWidth: 1280
          captureHeight: 800
